<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>GitHub 토큰 테스트</title>
<style>
  body{ font-family:sans-serif; max-width:560px; margin:60px auto; padding:0 20px; }
  input{ width:100%; padding:10px; font-size:14px; box-sizing:border-box; margin-bottom:10px; }
  button{ padding:10px 18px; font-size:14px; cursor:pointer; }
  #result{ margin-top:20px; padding:16px; border-radius:6px; font-size:15px; white-space:pre-wrap; }
  .ok{ background:#e6f4ea; color:#1e7e34; border:1px solid #1e7e34; }
  .fail{ background:#fdecea; color:#c0392b; border:1px solid #c0392b; }
</style>
</head>
<body>
  <h2>GitHub 토큰 테스트</h2>
  <p>발급받은 토큰을 아래에 <b>붙여넣기만</b> 하고 버튼을 누르세요. 코드를 직접 타이핑하지 않아도 됩니다.</p>
  <input type="text" id="token" placeholder="github_pat_ 로 시작하는 토큰 붙여넣기">
  <button id="testBtn">1) 토큰 자체가 유효한지 테스트</button>
  <button id="actionsBtn">2) Actions 실행 권한 테스트 (진짜 재분석 트리거)</button>
  <div id="result"></div>

  <script>
    async function runTest(url, options, resultPrefix){
      const el = document.getElementById('result');
      const token = document.getElementById('token').value.trim();
      if(!token){ el.className='fail'; el.textContent='토큰을 먼저 입력해주세요.'; return; }
      el.className=''; el.textContent='확인 중...';
      try{
        const res = await fetch(url, options(token));
        let bodyText = '';
        try{ bodyText = JSON.stringify(await res.json(), null, 2); }catch(e){ bodyText = '(본문 없음, 정상일 수 있음)'; }
        if(res.status === 200 || res.status === 204){
          el.className='ok';
          el.textContent = `✅ 성공! (상태코드 ${res.status})\n${resultPrefix}\n${bodyText}`;
        } else {
          el.className='fail';
          el.textContent = `❌ 실패 (상태코드 ${res.status})\n${bodyText}`;
        }
      }catch(err){
        el.className='fail';
        el.textContent = '❌ 네트워크 오류: ' + err.message;
      }
    }

    document.getElementById('testBtn').addEventListener('click', ()=>{
      runTest('https://api.github.com/user', (token)=>({
        headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json' }
      }), '토큰이 실제로 인증되었습니다 (이건 로그인해야만 볼 수 있는 정보예요).');
    });

    document.getElementById('actionsBtn').addEventListener('click', ()=>{
      runTest('https://api.github.com/repos/blewhere-crypto/fss-dispute-tracker/actions/workflows/analyze-single.yml/dispatches', (token)=>({
        method: 'POST',
        headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
        body: JSON.stringify({ ref: 'main', inputs: { ntt_id: 'test-token-check' } })
      }), 'Actions 실행 권한이 정상입니다. (204는 본문 없이 성공했다는 뜻)');
    });
  </script>
</body>
</html>
