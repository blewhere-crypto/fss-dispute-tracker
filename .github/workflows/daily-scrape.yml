name: Daily FSS Dispute Case Scrape

on:
  schedule:
    - cron: "17 21 * * *"   # UTC 21:09 = KST 06:09 (정각을 피해 지연/누락 확률을 줄임)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-scrape
  cancel-in-progress: false   # 겹치면 동시에 돌리지 않고 순서대로 대기

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install LibreOffice (for hwp text extraction)
        run: sudo apt-get update && sudo apt-get install -y libreoffice

      - name: Scrape latest case list
        run: python scraper.py --detail

      - name: AI analyze new cases (Gemini free tier)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python ai_analyze.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          git diff --staged --quiet && echo "변경 없음" || git commit -m "chore: daily data + analysis update $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "푸시 재시도 ($i)..."
            sleep 5
          done
