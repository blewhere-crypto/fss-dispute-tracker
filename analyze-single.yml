name: Reanalyze Single Case

on:
  workflow_dispatch:
    inputs:
      ntt_id:
        description: "재분석할 사례의 nttId (대시보드에서 복사한 값)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: daily-scrape   # 정기 크롤링과 같은 그룹으로 묶어서 동시 push 충돌 방지
  cancel-in-progress: false

jobs:
  reanalyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install LibreOffice (for hwp text extraction)
        run: sudo apt-get update && sudo apt-get install -y libreoffice default-jre-headless

      - name: Install H2Orestart extension (hwp format support for LibreOffice)
        run: |
          wget -qO /tmp/H2Orestart.oxt https://github.com/ebandal/H2Orestart/releases/latest/download/H2Orestart.oxt
          unopkg add --shared --suppress-license /tmp/H2Orestart.oxt

      - name: Reanalyze one case
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python ai_analyze.py --ntt-id "${{ inputs.ntt_id }}"

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          git diff --staged --quiet && echo "변경 없음" || git commit -m "chore: reanalyze case ${{ inputs.ntt_id }}"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "푸시 재시도 ($i)..."
            sleep 5
          done
